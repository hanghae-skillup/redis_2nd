plugins {
    id 'java-library'
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'

}

repositories {
    mavenCentral()
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}
dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'// ✅ JPA 추가
    implementation 'org.springframework.boot:spring-boot-starter-web'  // ✅ Spring Web 추가 (선택 사항)
    runtimeOnly 'com.mysql:mysql-connector-j' // ✅ MySQL 사용 시 추가 (DB에 맞게 수정)

    implementation 'org.springframework.boot:spring-boot-starter-data-redis' //레디스
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.0' // 레디션 분산락



}

test {
    useJUnitPlatform()
}